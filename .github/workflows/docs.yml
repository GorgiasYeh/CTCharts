name: Documentation

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build DocC archive
        run: |
          xcodebuild docbuild \
            -scheme CTCharts \
            -destination 'generic/platform=iOS' \
            -derivedDataPath .build/docbuild

      - name: Transform for static hosting
        run: |
          ARCHIVE=$(find .build/docbuild -type d -name 'CTCharts.doccarchive' | head -1)
          $(xcrun --find docc) process-archive transform-for-static-hosting "$ARCHIVE" \
            --output-path docs \
            --hosting-base-path CTCharts
          echo '<meta http-equiv="refresh" content="0; url=/CTCharts/documentation/ctcharts/">' > docs/index.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
